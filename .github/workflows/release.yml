name: Release Skills

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: python3 -m pytest scripts/test_catalog.py scripts/test_infer_risk.py -v

      - name: Build catalog
        run: python3 scripts/catalog.py

      - name: Quality gate
        run: |
          python3 -c "
          import json, sys
          with open('dist/pack-catalog.json') as f:
              catalog = json.load(f)
          missing_name = sum(1 for s in catalog if 'missing-name' in s.get('issues', []))
          if missing_name > 0:
              print(f'FAIL: {missing_name} skills missing name')
              sys.exit(1)
          print(f'OK: {len(catalog)} skills indexed, no critical issues')
          "

      - name: Build curated .skill files
        run: bash scripts/release.sh

      - name: Build pack .skill files
        run: bash scripts/release.sh --packs all

      - name: Package skills by category
        run: |
          mkdir -p dist/release
          for category_dir in dist/*/; do
            category=$(basename "$category_dir")
            [ "$category" = "release" ] && continue
            skill_count=$(find "$category_dir" -name "*.skill" | wc -l)
            [ "$skill_count" -eq 0 ] && continue
            (cd dist && zip -qr "release/${category}.zip" "$category"/*)
            echo "  $category: $skill_count skills -> release/${category}.zip"
          done
          ls -lh dist/release/

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true

      - name: Create release and upload skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "Skills — última versão" \
            --notes "Arquivos de skills organizados por categoria. Cada ZIP contem os arquivos \`.skill\` da categoria. Veja o [README](https://github.com/${{ github.repository }}/blob/master/README.md) para instruções." \
            --latest \
            dist/release/*.zip
