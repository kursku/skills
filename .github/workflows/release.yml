name: Release Skills

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: python3 -m pytest scripts/test_catalog.py scripts/test_infer_risk.py -v

      - name: Build catalog
        run: python3 scripts/catalog.py

      - name: Quality gate
        run: |
          python3 -c "
          import json, sys
          with open('dist/pack-catalog.json') as f:
              catalog = json.load(f)
          missing_name = sum(1 for s in catalog if 'missing-name' in s.get('issues', []))
          if missing_name > 0:
              print(f'FAIL: {missing_name} skills missing name')
              sys.exit(1)
          print(f'OK: {len(catalog)} skills indexed, no critical issues')
          "

      - name: Build curated .skill files
        run: bash scripts/release.sh

      - name: Build pack .skill files
        run: bash scripts/release.sh --packs all

      - name: Collect built files
        id: collect
        run: |
          files=$(find dist -name "*.skill" | sort | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true

      - name: Create release and upload skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "Skills — última versão" \
            --notes "Arquivos `.skill` prontos para upload no claude.ai. Veja o [README](https://github.com/${{ github.repository }}/blob/master/README.md) para instruções." \
            --latest \
            ${{ steps.collect.outputs.files }}
